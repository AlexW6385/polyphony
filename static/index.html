<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polyphony</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #fffdf8; --ink: #22201c; --muted: #7a756b; --line: #e3ddd0;
    --accent: #3b5bdb; --conscious: #b8860b; --world: #2b8a3e; --cadence: #862e9c; --digest: #0b7285;
    --quiet: #adb5bd; --speak: #3b5bdb;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --panel: #1e1e23; --ink: #e9e6df; --muted: #8e8a82; --line: #2e2e35;
            --accent: #748ffc; --conscious: #f2c94c; --world: #69db7c; --cadence: #da77f2; --digest: #66d9e8;
            --quiet: #5c636a; --speak: #748ffc; }
  }
  * { box-sizing: border-box; }
  /* The page itself never scrolls; each column scrolls on its own. */
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans);
         display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex;
           align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  header .right { margin-left: auto; display: flex; gap: 10px; align-items: baseline; }
  header .status { color: var(--muted); font-size: 12px; }
  header #pause.paused { border-color: var(--cadence); color: var(--cadence); }
  main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 320px; gap: 0;
         flex: 1; min-height: 0; }
  section { overflow-y: auto; padding: 16px; min-height: 0; }
  section + section { border-left: 1px solid var(--line); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
       margin: 0 0 8px; }
  .block { margin-bottom: 22px; }
  textarea, input, select { width: 100%; font: inherit; color: inherit; background: var(--panel);
       border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
  textarea { resize: vertical; min-height: 64px; }
  .mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: inherit;
           border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:hover { filter: brightness(1.05); }
  .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .row > input { flex: 1; }
  .item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
          background: var(--panel); }
  .item .name { font-weight: 600; }
  .item.off { opacity: .5; }
  .item .actions { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .item .actions button { font-size: 12px; padding: 2px 8px; }
  .small { font-size: 12px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin: 4px 0; }

  #stream { max-width: 760px; margin: 0 auto; }
  .thought { padding: 10px 0 12px; border-bottom: 1px dashed var(--line); }
  .thought .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; }
  .thought .who { font-weight: 600; color: var(--ink); }
  .thought .body { white-space: pre-wrap; margin-top: 2px; }
  .thought.conscious .who { color: var(--conscious); }
  .thought.conscious .body { font-weight: 500; }
  .thought.digest { margin: 10px 0; }
  .vote.digest-card { border-color: var(--digest); }
  .vote.digest-card .result.decided { border-left-color: var(--digest); }
  .vote ul { margin: 0; padding-left: 18px; }
  .thought.digest .who { color: var(--digest); }
  .thought.world .who { color: var(--world); }
  .thought.world a { color: var(--world); }
  .thought.cadence { border: 1px solid var(--cadence); border-radius: 8px; padding: 10px 12px;
                     margin: 10px 0; }
  .thought.cadence .who { color: var(--cadence); }
  .vote { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 4px;
          background: var(--panel); }
  .vote h4 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
             color: var(--muted); font-weight: 500; }
  .vote h4:first-child { margin-top: 0; }
  .vote .question { font-weight: 600; white-space: pre-wrap; }
  .vote .result { font-weight: 600; padding: 6px 8px; border-radius: 6px; background: var(--bg); }
  .vote .result.decided { border-left: 3px solid var(--cadence); }
  .vote table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .vote td, .vote th { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: top;
                       text-align: left; }
  .vote th { font-weight: 500; color: var(--muted); font-size: 12px; border-top: none; }
  .vote tr.won td { font-weight: 600; }
  .vote .track { background: var(--bg); border-radius: 3px; height: 8px; margin-top: 5px; }
  .thought.pending { border-style: dashed; }
  .vote .voting { display: flex; align-items: center; gap: 8px; color: var(--cadence); font-weight: 600; }
  .vote .voting .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cadence);
                       animation: pulse 1s infinite; }
  .vote ol.options { margin: 0; padding-left: 22px; list-style: upper-alpha; }
  .vote .fill { height: 8px; background: var(--cadence); border-radius: 0 3px 3px 0; min-width: 1px; }
  .vote .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); text-align: center; margin-top: 30vh; }

  .listen { display: grid; grid-template-columns: 10px 1fr; gap: 8px; padding: 6px 0;
            border-bottom: 1px dashed var(--line); }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--quiet); }
  .dot.forming { background: var(--speak); animation: pulse 1s infinite; }
  .dot.listening { background: var(--speak); opacity: .45; }
  @keyframes pulse { 50% { opacity: .3; } }
  .listen .reason { color: var(--muted); }
  @media (max-width: 1000px) {
    body { overflow: auto; display: block; }  /* stacked columns on a narrow screen scroll as a page */
    main { grid-template-columns: 1fr; }
    section + section { border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Polyphony</h1>
  <span class="right">
  <span class="status" id="status" title="Connection to the local server">connecting…</span>
  <a href="/settings" class="small">Settings</a>
  <button id="pause" title="Stop every voice, sense and background job">Stop all</button></span>
</header>
<main>
  <section id="side">
    <div class="block">
      <h2>Think</h2>
      <form id="think-form">
        <textarea id="think" placeholder="What's on your mind…"></textarea>
        <div class="row"><button class="primary">Think</button>
          <span class="small">⌘/Ctrl+Enter</span></div>
      </form>
    </div>
    <div class="block">
      <h2>Voices</h2>
      <div id="voices"></div>
      <details>
        <summary>Add a voice</summary>
        <form id="voice-form">
          <input id="voice-name" placeholder="name (e.g. sleep)" class="mono">
          <textarea id="voice-text" rows="7" placeholder="What this voice cares about and how it talks, in a sentence or two"></textarea>
          <div class="row"><button class="primary">Add voice</button></div>
        </form>
      </details>
    </div>
    <div class="block">
      <h2>Senses</h2>
      <div id="senses"></div>
      <details>
        <summary>Add a sense</summary>
        <form id="sense-form">
          <input id="sense-name" placeholder="name (e.g. coop-hiring)" class="mono">
          <textarea id="sense-instruction" rows="3" placeholder="What to look for in the world"></textarea>
          <textarea id="sense-feeds" rows="3" class="mono" placeholder="RSS/Atom feed URLs, one per line"></textarea>
          <div class="row"><span class="small">daily at</span>
            <input id="sense-at" type="time" value="04:00" style="width:auto">
            <button class="primary">Add sense</button></div>
        </form>
      </details>
    </div>
  </section>

  <section><div id="stream"><p class="empty" id="empty">The stream is empty. Think something.</p></div></section>

  <section>
    <h2>Listening</h2>
    <div id="listens"></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (method, path, body) => {
  const r = await fetch(path, { method, headers: {"Content-Type": "application/json"},
                                body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { const t = await r.text(); alert(`${method} ${path}: ${t}`); throw new Error(t); }
  return r.status === 204 ? null : r.json();
};
const time = (iso) => iso ? new Date(iso).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"}) : "";

// ---------------------------------------------------------------- stream
let lastSeq = 0;
const seen = new Set();

function cadenceHtml(t) {
  const m = t.meta || {};
  if (!m.options) return `<div class="body">${esc(t.content)}</div>`;
  const r = m.result || {}, shares = r.shares || [], weights = m.weights || {};
  const letter = (i) => String.fromCharCode(65 + i);
  const pct = (x) => `${Math.round((x || 0) * 100)}%`;
  const votes = Object.entries(m.votes || {});
  const backers = (i) => votes.filter(([, x]) => (x.support || []).includes(i)).length;
  const options = m.options.map((o, i) => `<tr class="${r.winner === i ? "won" : ""}">
      <td style="width:18px"><b>${letter(i)}</b></td>
      <td>${esc(o)}<div class="track"><div class="fill" style="width:${pct(shares[i])}"></div></div></td>
      <td class="num">${pct(shares[i])}<div class="small">${backers(i)} of ${votes.length} voices</div></td></tr>`).join("");
  const result = r.decided
    ? `<div class="result decided">Decided: ${letter(r.winner)}. ${esc(m.options[r.winner])} (${pct(shares[r.winner])} of the weighted vote)</div>`
    : `<div class="result">Undecided: no option had 60% or more of the weighted vote</div>`;
  const rows = votes.sort(([a], [b]) => (weights[b] || 0) - (weights[a] || 0)).map(([v, x]) => `<tr>
      <td><b>${esc(v)}</b></td><td class="num">${(weights[v] || 0).toFixed(2)}</td>
      <td>${(x.support || []).map(letter).join(", ") || "none"}</td>
      <td class="small">${esc(x.reason)}</td></tr>`).join("");
  return `<div class="vote">
    <h4>Question</h4><div class="question">${esc(m.question)}</div>
    <h4>Options</h4><table>${options}</table>
    <h4>Result</h4>${result}
    <h4>Voices</h4><table><tr><th>voice</th><th class="num">weight</th><th>supports</th><th>why</th></tr>${rows}</table>
  </div>`;
}

function digestHtml(t) {
  const m = t.meta || {}, d = m.summary;
  if (!d) return `<div class="body">${esc(t.content)}</div>`;  // digests written before summaries
  const positions = (d.positions || []).map(p => `<tr><td style="width:110px"><b>${esc(p.voice)}</b></td>
      <td>${esc(p.view)}</td></tr>`).join("");
  return `<div class="vote digest-card">
    <h4>Outcome</h4><div class="result ${d.decided ? "decided" : ""}">${d.decided ? "Decided: " : "Not decided: "}${esc(d.outcome)}</div>
    ${d.question ? `<h4>Question</h4><div class="question">${esc(d.question)}</div>` : ""}
    ${positions ? `<h4>Positions</h4><table>${positions}</table>` : ""}
    ${(d.open || []).length ? `<h4>Still open</h4><ul>${d.open.map(o => `<li>${esc(o)}</li>`).join("")}</ul>` : ""}
    <div class="small" style="margin-top:8px">covers #${m.from_seq}–#${m.to_seq}</div>
  </div>`;
}

// Follow new thoughts only while the reader is at the bottom of the stream; if they have
// scrolled up to read, stay where they are.
const streamScroller = () => $("#stream").parentElement;
const nearBottom = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < 60;
let followStream = true;

function addThought(t) {
  if (seen.has(t.seq)) return;
  seen.add(t.seq);
  lastSeq = Math.max(lastSeq, t.seq);
  $("#empty")?.remove();
  const div = document.createElement("div");
  div.className = `thought ${t.kind}`;
  const url = t.meta && t.meta.url ? ` · <a href="${esc(t.meta.url)}" target="_blank" rel="noopener">source</a>` : "";
  const human = t.kind === "conscious";
  const kindTag = t.kind === "voice" || human ? "" : `<span>[${t.kind}]</span>`;
  div.innerHTML = `<div class="meta"><span>#${t.seq}</span><span class="who">${esc(human ? "conscious" : t.author)}</span>
      ${kindTag}${t.mood ? `<span>(${esc(t.mood)})</span>` : ""}<span>${time(t.created_at)}</span>${url}</div>` +
    (t.kind === "cadence" ? cadenceHtml(t) : t.kind === "digest" ? digestHtml(t)
      : `<div class="body">${esc(t.content)}</div>`);
  // keep order of record even if events arrive out of order
  const stream = $("#stream");
  // The result replaces its voting card; drop the card before finding where to insert.
  if (t.kind === "cadence" && t.meta) stream.querySelector(`.thought.pending[data-cadence="${t.meta.cadence_id}"]`)?.remove();
  const after = [...stream.children].find(c => +c.dataset.seq > t.seq);
  div.dataset.seq = t.seq;
  stream.insertBefore(div, after || null);
  if ((!after || after.classList.contains("pending")) && followStream) { const el = streamScroller(); el.scrollTop = el.scrollHeight; }
}

async function loadHistory() {
  let batch;
  do {
    batch = await api("GET", `/thoughts?after=${lastSeq}&limit=500`);
    batch.forEach(addThought);
  } while (batch.length === 500);
}

streamScroller().addEventListener("scroll", () => { followStream = nearBottom(streamScroller()); });

function connect() {
  const es = new EventSource(`/stream?after=${lastSeq}`);
  es.onmessage = (e) => addThought(JSON.parse(e.data));
  es.onopen = () => $("#status").textContent = "live";
  es.onerror = () => { $("#status").textContent = "reconnecting…"; es.close(); setTimeout(connect, 2000); };
}

// A vote under way is shown at the end of the stream until its result lands as a thought.
async function refreshVoting() {
  let running;
  try { running = await api("GET", "/cadences/running"); } catch { return; }
  const stream = $("#stream");
  const ids = new Set(running.map(c => String(c.id)));
  stream.querySelectorAll(".thought.pending").forEach(d => { if (!ids.has(d.dataset.cadence)) d.remove(); });
  for (const c of running) {
    const stage = c.round === 1 ? "round 1 of 2: the voices weigh each other on this question"
                                : "round 2 of 2: the voices vote";
    const html = `<div class="meta"><span class="who">cadence</span><span>[voting]</span>
        <span>${time(c.started_at)}</span></div>
      <div class="vote"><div class="voting"><div class="dot"></div>Voting in progress · ${stage}</div>
        <h4>Question</h4><div class="question">${esc(c.question)}</div>
        <h4>Options</h4><ol class="options">${(c.options || []).map(o => `<li>${esc(o)}</li>`).join("")}</ol></div>`;
    let div = stream.querySelector(`.thought.pending[data-cadence="${c.id}"]`);
    if (!div) {
      $("#empty")?.remove();
      div = document.createElement("div");
      div.className = "thought cadence pending";
      div.dataset.cadence = c.id;
      div.dataset.seq = Infinity;  // stays after every recorded thought
      stream.appendChild(div);
      if (followStream) { const el = streamScroller(); el.scrollTop = el.scrollHeight; }
    }
    if (div.innerHTML !== html) div.innerHTML = html;
  }
}

// ---------------------------------------------------------------- listens + voices
let voices = [];

function renderListens() {
  $("#listens").innerHTML = voices.filter(v => v.enabled).map(v => {
    const l = v.last_listen;
    // Three states: listening (deciding whether to speak), forming (writing a thought now) or
    // quiet (nothing to say for now, or already said it).
    const state = v.forming ? "forming…" : v.listening ? "listening…" : "quiet";
    const dot = v.forming ? "forming" : v.listening ? "listening" : "";
    return `<div class="listen"><div class="dot ${dot}"></div><div>
      <b>${esc(v.name)}</b> <span class="small">${state}${l ? " · " + esc(l.mood) + " · at #" + l.trigger_seq : ""}</span>
      ${l ? `<div class="reason">${esc(l.reason)}</div>` : ""}</div></div>`;
  }).join("") || `<p class="small">No voices.</p>`;
}

function renderVoices() {
  $("#voices").innerHTML = voices.map(v => `
    <div class="item ${v.enabled ? "" : "off"}" data-name="${esc(v.name)}">
      <span class="name">${esc(v.name)}</span>
      ${Object.keys(v.overrides || {}).length ? `<span class="small mono"> ${esc(JSON.stringify(v.overrides))}</span>` : ""}
      <div class="actions">
        <button data-act="toggle">${v.enabled ? "Disable" : "Enable"}</button>
        <button data-act="edit">Edit</button>
        <button data-act="delete">Delete</button>
      </div>
    </div>`).join("");
}

async function refreshVoices() {
  try { voices = await api("GET", "/voices"); } catch { return; }
  renderListens();
  const editing = document.querySelector("#voices textarea");
  if (!editing) renderVoices();
}

$("#voices").addEventListener("click", async (e) => {
  const btn = e.target.closest("button"); if (!btn) return;
  const item = btn.closest(".item"); const name = item.dataset.name;
  const v = voices.find(x => x.name === name);
  const act = btn.dataset.act;
  if (act === "toggle") await api("PUT", `/voices/${name}`, {enabled: !v.enabled});
  if (act === "delete" && confirm(`Delete voice "${name}"?`)) await api("DELETE", `/voices/${name}`);
  if (act === "edit") {
    item.innerHTML = `<span class="name">${esc(name)}</span>
      <textarea rows="9">${esc(v.text)}</textarea>
      <div class="actions"><button data-act="save" class="primary">Save</button><button data-act="cancel">Cancel</button></div>`;
    return;
  }
  if (act === "save") {
    await api("PUT", `/voices/${name}`, {text: item.querySelector("textarea").value});
  }
  item.querySelector("textarea")?.remove();
  await refreshVoices(); renderVoices();
});

$("#voice-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  await api("POST", "/voices", {name: $("#voice-name").value.trim(), text: $("#voice-text").value});
  e.target.reset(); await refreshVoices();
});

// ---------------------------------------------------------------- senses
async function refreshSenses() {
  const senses = await api("GET", "/senses");
  $("#senses").innerHTML = senses.map(s => `
    <div class="item ${s.enabled ? "" : "off"}" data-name="${esc(s.name)}">
      <span class="name">${esc(s.name)}</span> <span class="small">daily at
        <input type="time" value="${esc(s.daily_at)}" data-act="at" style="width:auto;padding:1px 4px">
        ${esc(s.timezone)}${s.last_run ? " · last ran " + new Date(s.last_run).toLocaleString() : ""}</span>
      <div class="small">${esc(s.instruction)}</div>
      <div class="small mono">${(s.feeds || []).map(esc).join("<br>") || "no feeds"}</div>
      <div class="actions">
        <button data-act="toggle" data-on="${s.enabled}">${s.enabled ? "Disable" : "Enable"}</button>
        <button data-act="run" title="Run once now, enabled or not">Run now</button>
        <button data-act="delete">Delete</button>
      </div>
    </div>`).join("") || `<p class="small">No senses.</p>`;
}

$("#senses").addEventListener("click", async (e) => {
  const btn = e.target.closest("button"); if (!btn) return;
  const name = btn.closest(".item").dataset.name;
  if (btn.dataset.act === "toggle") await api("PUT", `/senses/${name}`, {enabled: btn.dataset.on !== "true"});
  if (btn.dataset.act === "delete" && confirm(`Delete sense "${name}"?`)) await api("DELETE", `/senses/${name}`);
  if (btn.dataset.act === "run") {
    const r = await fetch(`/senses/${name}/run`, {method: "POST"});
    if (r.status === 409) { alert("Stopped. Resume first."); return; }
    btn.textContent = "Running…"; btn.disabled = true;
    setTimeout(refreshSenses, 30000);
    return;
  }
  refreshSenses();
});
$("#senses").addEventListener("change", async (e) => {
  if (e.target.dataset.act !== "at" || !e.target.value) return;
  const name = e.target.closest(".item").dataset.name;
  await api("PUT", `/senses/${name}`, {daily_at: e.target.value}); refreshSenses();
});

$("#sense-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  await api("POST", "/senses", {name: $("#sense-name").value.trim(),
    instruction: $("#sense-instruction").value, daily_at: $("#sense-at").value || "04:00",
    feeds: $("#sense-feeds").value.split("\n").map(x => x.trim()).filter(Boolean)});
  e.target.reset(); refreshSenses();
});

// ---------------------------------------------------------------- think
$("#think-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const content = $("#think").value.trim(); if (!content) return;
  await api("POST", "/thoughts", {content}); $("#think").value = "";
});
$("#think").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#think-form").requestSubmit();
});

// ---------------------------------------------------------------- pause
// One switch for everything that calls a model; thoughts can still be dropped in while stopped.
let paused = false;
function showPause(p) {
  paused = p;
  $("#pause").textContent = p ? "Resume" : "Stop all";
  $("#pause").classList.toggle("paused", p);
  $("#pause").title = p ? "Everything is stopped. Resume voices, senses and background jobs"
                        : "Stop every voice, sense and background job";
}
async function refreshPause() {
  try { showPause((await api("GET", "/pause")).paused); } catch {}
}
$("#pause").addEventListener("click", async () => {
  showPause((await api("POST", paused ? "/resume" : "/pause")).paused);
});
// ---------------------------------------------------------------- boot
(async () => {
  await loadHistory();
  connect();
  refreshVoices(); refreshSenses(); refreshPause();
  refreshVoting();
  setInterval(refreshVoices, 3000);
  setInterval(refreshVoting, 2000);
  setInterval(refreshPause, 5000);
  setInterval(refreshSenses, 30000);
})();
</script>
</body>
</html>
