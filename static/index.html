<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polyphony</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #fffdf8; --ink: #22201c; --muted: #7a756b; --line: #e3ddd0;
    --accent: #3b5bdb; --conscious: #b8860b; --world: #2b8a3e; --cadence: #862e9c; --digest: #0b7285;
    --rest: #adb5bd; --speak: #3b5bdb;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --panel: #1e1e23; --ink: #e9e6df; --muted: #8e8a82; --line: #2e2e35;
            --accent: #748ffc; --conscious: #f2c94c; --world: #69db7c; --cadence: #da77f2; --digest: #66d9e8;
            --rest: #5c636a; --speak: #748ffc; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex;
           align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  header .right { margin-left: auto; display: flex; gap: 10px; align-items: baseline; }
  header .status { color: var(--muted); font-size: 12px; }
  header #pause.paused { border-color: var(--cadence); color: var(--cadence); }
  main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 320px; gap: 0;
         height: calc(100vh - 53px); }
  section { overflow-y: auto; padding: 16px; }
  section + section { border-left: 1px solid var(--line); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
       margin: 0 0 8px; }
  .block { margin-bottom: 22px; }
  textarea, input, select { width: 100%; font: inherit; color: inherit; background: var(--panel);
       border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
  textarea { resize: vertical; min-height: 64px; }
  .mono { font-family: var(--mono); font-size: 12px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: inherit;
           border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:hover { filter: brightness(1.05); }
  .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .row > input { flex: 1; }
  .item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
          background: var(--panel); }
  .item .name { font-weight: 600; }
  .item.off { opacity: .5; }
  .item .actions { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .item .actions button { font-size: 12px; padding: 2px 8px; }
  .small { font-size: 12px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin: 4px 0; }

  #score { max-width: 760px; margin: 0 auto; }
  .thought { padding: 10px 0 12px; border-bottom: 1px dashed var(--line); }
  .thought .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; }
  .thought .who { font-weight: 600; color: var(--ink); }
  .thought .body { white-space: pre-wrap; margin-top: 2px; }
  .thought.theme .who { color: var(--conscious); }
  .thought.theme .body { font-weight: 500; }
  .thought.digest { border: 1px solid var(--digest); border-radius: 8px; padding: 10px 12px;
                    margin: 10px 0; background: var(--panel); }
  .thought.digest .who { color: var(--digest); }
  .thought.world .who { color: var(--world); }
  .thought.world a { color: var(--world); }
  .thought.cadence { border: 1px solid var(--cadence); border-radius: 8px; padding: 10px 12px;
                     margin: 10px 0; }
  .thought.cadence .who { color: var(--cadence); }
  .cadence-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
  .cadence-table td { padding: 2px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  .bar { height: 6px; background: var(--cadence); border-radius: 3px; }
  .verdict { font-weight: 600; }
  .empty { color: var(--muted); text-align: center; margin-top: 30vh; }

  .listen { display: grid; grid-template-columns: 10px 1fr; gap: 8px; padding: 6px 0;
            border-bottom: 1px dashed var(--line); }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--rest); }
  .dot.speak { background: var(--speak); }
  .dot.forming { background: var(--speak); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .listen .reason { color: var(--muted); }
  @media (max-width: 1000px) {
    main { grid-template-columns: 1fr; height: auto; }
    section + section { border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Polyphony</h1>
  <span class="right">
  <span class="status" id="status" title="Connection to the local server">connecting…</span>
  <a href="/settings" class="small">Settings</a>
  <button id="pause" title="Stop every voice, sense and background job">Stop all</button></span>
</header>
<main>
  <section id="side">
    <div class="block">
      <h2>Theme</h2>
      <form id="theme-form">
        <textarea id="theme" placeholder="Drop a theme into the room…"></textarea>
        <div class="row"><button class="primary">Theme</button>
          <span class="small">⌘/Ctrl+Enter</span></div>
      </form>
    </div>
    <div class="block">
      <h2>Decide</h2>
      <form id="decide-form">
        <input id="resolution" placeholder="A resolution to vote on">
        <div class="row"><button class="primary">Cadence</button><button type="button" id="digest-now">Digest now</button></div>
      </form>
    </div>
    <div class="block">
      <h2>Key</h2>
      <details>
        <summary>What this mind is, and how its voices relate</summary>
        <form id="key-form">
          <textarea id="key-text" rows="9"></textarea>
          <div class="row"><button class="primary">Save key</button>
            <span class="small">voices restart with it</span></div>
        </form>
      </details>
    </div>
    <div class="block">
      <h2>Voices</h2>
      <div id="voices"></div>
      <details>
        <summary>Add a voice</summary>
        <form id="voice-form">
          <input id="voice-name" placeholder="name (e.g. sleep)" class="mono">
          <textarea id="voice-text" rows="7" placeholder="What this voice cares about and how it talks, in a sentence or two"></textarea>
          <div class="row"><button class="primary">Add voice</button></div>
        </form>
      </details>
    </div>
    <div class="block">
      <h2>Senses</h2>
      <div id="senses"></div>
      <details>
        <summary>Add a sense</summary>
        <form id="sense-form">
          <input id="sense-name" placeholder="name (e.g. coop-hiring)" class="mono">
          <textarea id="sense-instruction" rows="3" placeholder="What to look for in the world"></textarea>
          <textarea id="sense-feeds" rows="3" class="mono" placeholder="RSS/Atom feed URLs, one per line"></textarea>
          <label class="small"><input type="checkbox" id="sense-search" style="width:auto">
            allow web search (needs EXA_API_KEY or TAVILY_API_KEY)</label>
          <div class="row"><span class="small">daily at</span>
            <input id="sense-at" type="time" value="04:00" style="width:auto">
            <button class="primary">Add sense</button></div>
        </form>
      </details>
    </div>
  </section>

  <section><div id="score"><p class="empty" id="empty">The score is empty. Drop a theme in.</p></div></section>

  <section>
    <h2>Listening</h2>
    <div id="listens"></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (method, path, body) => {
  const r = await fetch(path, { method, headers: {"Content-Type": "application/json"},
                                body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { const t = await r.text(); alert(`${method} ${path}: ${t}`); throw new Error(t); }
  return r.status === 204 ? null : r.json();
};
const time = (iso) => iso ? new Date(iso).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"}) : "";

// ---------------------------------------------------------------- score
let lastSeq = 0;
const seen = new Set();

function cadenceHtml(t) {
  const m = t.meta || {};
  if (!m.votes) return `<div class="body">${esc(t.content)}</div>`;
  const r = m.result || {};
  const share = r.share_for == null ? "n/a" : Math.round(r.share_for * 100) + "%";
  const rows = Object.entries(m.votes).map(([v, x]) => {
    const w = (m.weights || {})[v] || 0;
    return `<tr><td><b>${esc(v)}</b></td>
      <td style="width:80px"><div class="bar" style="width:${Math.round(w * 100 * 2.5)}%"></div>
        <span class="small">${w.toFixed(2)}</span></td>
      <td>${esc(x.vote)}</td><td class="small">${esc(x.reason)}</td></tr>`;
  }).join("");
  return `<div class="body">“${esc(m.resolution)}” <span class="small">called by ${esc(m.proposed_by)}</span></div>
    <div class="verdict">${r.passed ? "Passed" : "Did not pass"} — weighted share for ${share}</div>
    <table class="cadence-table">${rows}</table>`;
}

// Follow new thoughts only while the reader is at the bottom of the score; if they have
// scrolled up to read, stay where they are.
const scoreScroller = () => $("#score").parentElement;
const nearBottom = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < 60;
let followScore = true;

function addThought(t) {
  if (seen.has(t.seq)) return;
  seen.add(t.seq);
  lastSeq = Math.max(lastSeq, t.seq);
  $("#empty")?.remove();
  const div = document.createElement("div");
  div.className = `thought ${t.kind}`;
  const url = t.meta && t.meta.url ? ` · <a href="${esc(t.meta.url)}" target="_blank" rel="noopener">source</a>` : "";
  const human = t.kind === "theme";
  const kindTag = t.kind === "voice" || human ? "" : `<span>[${t.kind}]</span>`;
  div.innerHTML = `<div class="meta"><span>#${t.seq}</span><span class="who">${esc(human ? "conscious" : t.author)}</span>
      ${kindTag}${t.mood ? `<span>(${esc(t.mood)})</span>` : ""}<span>${time(t.created_at)}</span>${url}</div>` +
    (t.kind === "cadence" ? cadenceHtml(t) : `<div class="body">${esc(t.content)}</div>`) +
    (t.kind === "digest" && t.meta ? `<div class="small">#${t.meta.from_seq}–#${t.meta.to_seq} · outcome: ${esc(t.meta.outcome)}</div>` : "");
  // keep order of record even if events arrive out of order
  const score = $("#score");
  const after = [...score.children].find(c => +c.dataset.seq > t.seq);
  div.dataset.seq = t.seq;
  score.insertBefore(div, after || null);
  if (!after && followScore) { const el = scoreScroller(); el.scrollTop = el.scrollHeight; }
}

async function loadHistory() {
  let batch;
  do {
    batch = await api("GET", `/thoughts?after=${lastSeq}&limit=500`);
    batch.forEach(addThought);
  } while (batch.length === 500);
}

scoreScroller().addEventListener("scroll", () => { followScore = nearBottom(scoreScroller()); });

function connect() {
  const es = new EventSource(`/score?after=${lastSeq}`);
  es.onmessage = (e) => addThought(JSON.parse(e.data));
  es.onopen = () => $("#status").textContent = "live";
  es.onerror = () => { $("#status").textContent = "reconnecting…"; es.close(); setTimeout(connect, 2000); };
}

// ---------------------------------------------------------------- listens + voices
let voices = [];

function renderListens() {
  $("#listens").innerHTML = voices.filter(v => v.enabled).map(v => {
    const l = v.last_listen;
    const cls = v.forming ? "forming" : (l && l.speak ? "speak" : "");
    const state = v.forming ? "forming…" : (l ? (l.speak ? "spoke" : "rest") : "not yet");
    return `<div class="listen"><div class="dot ${cls}"></div><div>
      <b>${esc(v.name)}</b> <span class="small">${state}${l ? " · " + esc(l.mood) + " · at #" + l.trigger_seq : ""}</span>
      ${l ? `<div class="reason">${esc(l.reason)}</div>` : ""}</div></div>`;
  }).join("") || `<p class="small">No voices.</p>`;
}

function renderVoices() {
  $("#voices").innerHTML = voices.map(v => `
    <div class="item ${v.enabled ? "" : "off"}" data-name="${esc(v.name)}">
      <span class="name">${esc(v.name)}</span>
      ${Object.keys(v.overrides || {}).length ? `<span class="small mono"> ${esc(JSON.stringify(v.overrides))}</span>` : ""}
      <div class="actions">
        <button data-act="toggle">${v.enabled ? "Disable" : "Enable"}</button>
        <button data-act="edit">Edit</button>
        <button data-act="delete">Delete</button>
      </div>
    </div>`).join("");
}

async function refreshVoices() {
  try { voices = await api("GET", "/voices"); } catch { return; }
  renderListens();
  const editing = document.querySelector("#voices textarea");
  if (!editing) renderVoices();
}

$("#voices").addEventListener("click", async (e) => {
  const btn = e.target.closest("button"); if (!btn) return;
  const item = btn.closest(".item"); const name = item.dataset.name;
  const v = voices.find(x => x.name === name);
  const act = btn.dataset.act;
  if (act === "toggle") await api("PUT", `/voices/${name}`, {enabled: !v.enabled});
  if (act === "delete" && confirm(`Delete voice "${name}"?`)) await api("DELETE", `/voices/${name}`);
  if (act === "edit") {
    item.innerHTML = `<span class="name">${esc(name)}</span>
      <textarea rows="9">${esc(v.text)}</textarea>
      <div class="actions"><button data-act="save" class="primary">Save</button><button data-act="cancel">Cancel</button></div>`;
    return;
  }
  if (act === "save") {
    await api("PUT", `/voices/${name}`, {text: item.querySelector("textarea").value});
  }
  item.querySelector("textarea")?.remove();
  await refreshVoices(); renderVoices();
});

$("#voice-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  await api("POST", "/voices", {name: $("#voice-name").value.trim(), text: $("#voice-text").value});
  e.target.reset(); await refreshVoices();
});

// ---------------------------------------------------------------- senses
async function refreshSenses() {
  const senses = await api("GET", "/senses");
  $("#senses").innerHTML = senses.map(s => `
    <div class="item ${s.enabled ? "" : "off"}" data-name="${esc(s.name)}">
      <span class="name">${esc(s.name)}</span> <span class="small">daily at
        <input type="time" value="${esc(s.daily_at)}" data-act="at" style="width:auto;padding:1px 4px">
        ${esc(s.timezone)}${s.last_run ? " · last ran " + new Date(s.last_run).toLocaleString() : ""}${s.search ? " · search" : ""}</span>
      <div class="small">${esc(s.instruction)}</div>
      <div class="small mono">${(s.feeds || []).map(esc).join("<br>") || "no feeds"}</div>
      <div class="actions">
        <button data-act="toggle" data-on="${s.enabled}">${s.enabled ? "Disable" : "Enable"}</button>
        <button data-act="run" title="Run once now, enabled or not">Run now</button>
        <button data-act="delete">Delete</button>
      </div>
    </div>`).join("") || `<p class="small">No senses.</p>`;
}

$("#senses").addEventListener("click", async (e) => {
  const btn = e.target.closest("button"); if (!btn) return;
  const name = btn.closest(".item").dataset.name;
  if (btn.dataset.act === "toggle") await api("PUT", `/senses/${name}`, {enabled: btn.dataset.on !== "true"});
  if (btn.dataset.act === "delete" && confirm(`Delete sense "${name}"?`)) await api("DELETE", `/senses/${name}`);
  if (btn.dataset.act === "run") {
    const r = await fetch(`/senses/${name}/run`, {method: "POST"});
    if (r.status === 409) { alert("Stopped. Resume first."); return; }
    btn.textContent = "Running…"; btn.disabled = true;
    setTimeout(refreshSenses, 30000);
    return;
  }
  refreshSenses();
});
$("#senses").addEventListener("change", async (e) => {
  if (e.target.dataset.act !== "at" || !e.target.value) return;
  const name = e.target.closest(".item").dataset.name;
  await api("PUT", `/senses/${name}`, {daily_at: e.target.value}); refreshSenses();
});

$("#sense-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  await api("POST", "/senses", {name: $("#sense-name").value.trim(),
    instruction: $("#sense-instruction").value, daily_at: $("#sense-at").value || "04:00",
    feeds: $("#sense-feeds").value.split("\n").map(x => x.trim()).filter(Boolean),
    search: $("#sense-search").checked});
  e.target.reset(); refreshSenses();
});

// ---------------------------------------------------------------- theme / decide
$("#theme-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const content = $("#theme").value.trim(); if (!content) return;
  await api("POST", "/thoughts", {content}); $("#theme").value = "";
});
$("#theme").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#theme-form").requestSubmit();
});
$("#decide-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const resolution = $("#resolution").value.trim(); if (!resolution) return;
  await api("POST", "/cadence", {resolution});
  $("#resolution").value = "";
});

// ---------------------------------------------------------------- pause, digest, key
// One switch for everything that calls a model; thoughts can still be dropped in while stopped.
let paused = false;
function showPause(p) {
  paused = p;
  $("#pause").textContent = p ? "Resume" : "Stop all";
  $("#pause").classList.toggle("paused", p);
  $("#pause").title = p ? "Everything is stopped. Resume voices, senses and background jobs"
                        : "Stop every voice, sense and background job";
}
async function refreshPause() {
  try { showPause((await api("GET", "/pause")).paused); } catch {}
}
$("#pause").addEventListener("click", async () => {
  showPause((await api("POST", paused ? "/resume" : "/pause")).paused);
});
$("#digest-now").addEventListener("click", async () => {
  const r = await fetch("/digest", {method: "POST"});
  if (r.status === 409) alert((await r.json()).detail === "nothing new to digest"
                              ? "Nothing new to digest." : "Stopped. Resume first.");
});
async function loadKey() {
  $("#key-text").value = (await api("GET", "/key")).text;
}
$("#key-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  await api("PUT", "/key", {text: $("#key-text").value});
  loadKey();
});
// ---------------------------------------------------------------- boot
(async () => {
  await loadHistory();
  loadKey();
  connect();
  refreshVoices(); refreshSenses(); refreshPause();
  setInterval(refreshVoices, 3000);
  setInterval(refreshPause, 5000);
  setInterval(refreshSenses, 30000);
})();
</script>
</body>
</html>
