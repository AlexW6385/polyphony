# Senses: standing instructions plus the feeds the person chose. Each runs on a
# schedule (never more often than every 30 minutes), reads the feeds over MCP,
# picks what matters, reads it, and drops new items into the stream as `world`
# thoughts. The DB is seeded from this file on first start only.
- name: world
  instruction: "The most important world news of the last day."
  every_minutes: 240
  feeds:
    - https://feeds.bbci.co.uk/news/world/rss.xml
    - https://www.cbc.ca/webfeed/rss/rss-world
  search: false
- name: tech
  instruction: "Anything notable for someone starting a career in software: AI, hiring, tools."
  every_minutes: 360
  feeds:
    - https://www.cbc.ca/webfeed/rss/rss-technology
    - https://hnrss.org/frontpage?points=300
  search: false
