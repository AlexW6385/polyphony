services:
  mind:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://polyphony:polyphony@postgres:5432/polyphony
      REDIS_URL: redis://redis:6379/0
      MIND_DIR: /app/mind
      STATIC_DIR: /app/static
      HOST: 0.0.0.0                       # inside the container only; see ports
      MCP_FETCH_COMMAND: mcp-server-fetch # installed in the image
      # Memory embeddings run in Ollama on the host (on a Mac, outside Docker it uses the GPU).
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux; Docker Desktop provides it already
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"    # no auth: reachable from this machine only
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: polyphony
      POSTGRES_PASSWORD: polyphony
      POSTGRES_DB: polyphony
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyphony"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
