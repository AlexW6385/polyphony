services:
  mind:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://polyphony:polyphony@postgres:5432/polyphony
      REDIS_URL: redis://redis:6379/0
      ENSEMBLES_DIR: /app/ensembles
      STATIC_DIR: /app/static
      HOST: 0.0.0.0                       # inside the container only; see ports
      MCP_FETCH_COMMAND: mcp-server-fetch # installed in the image
      # Ollama runs on the host (on macOS, Docker cannot use the GPU).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"    # no auth: reachable from this machine only
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: polyphony
      POSTGRES_PASSWORD: polyphony
      POSTGRES_DB: polyphony
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyphony"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Linux hosts with a GPU: `docker compose --profile ollama up`, then set
  # OLLAMA_BASE_URL=http://ollama:11434 and pull the models into it.
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  pgdata:
  ollama:
